name: Windows C++ build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: MSVC build and CPU-safe tests
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DUNDERDOG_BUILD_EXAMPLES=ON
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Test (no hardware GPU required)
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate hardware compatibility matrix
        run: python tools/validate_compatibility.py
      - name: Validate Intel driver interface map (static, no GPU required)
        run: python tools/driver_intelligence/validate_intel_adapter_map.py
      - name: Validate Intel CreateDevice callback mapping
        run: python tools/driver_intelligence/validate_intel_createdevice.py
      - name: Validate Intel D3D12 PSO and resource callback map
        run: python tools/driver_intelligence/validate_intel_pso_resource.py
      - name: Validate typed UAV binding witness metadata
        run: python tools/driver_intelligence/validate_uav_binding_v05.py
